[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lnmesh-lifecycle"
version = "0.1.0"
description = "Offline-safe LNMesh channel lifecycle control plane"
requires-python = ">=3.11"

[project.scripts]
lnmeshctl = "lnmeshctl.cli:main"
lnmesh-lifecycle-worker = "lnmeshctl.worker:main"

[tool.setuptools]
packages = ["lnmeshctl"]
